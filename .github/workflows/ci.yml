name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-Dwarnings"

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4.1.1

    - name: Install smbclient
      run: sudo apt-get update && sudo apt-get install -y smbclient

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: stable
        components: rustfmt, clippy

    - name: Cache dependencies
      uses: Swatinem/rust-cache@v2
      with:
        cache-directories: |
          ~/.cargo/bin/
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/

    - name: Build
      run: cargo build --verbose

    - name: Run tests
      run: cargo test --verbose

    - name: Check formatting
      run: cargo fmt --check

    - name: Run clippy
      run: cargo clippy --all-targets --all-features -- -D warnings

  msrv:
    name: MSRV (1.99)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4.1.1

    - name: Install Rust 1.99
      uses: dtolnay/rust-toolchain@1.99

    - name: Cache dependencies
      uses: Swatinem/rust-cache@v2

    # --locked: check the committed Cargo.lock as is. Cargo refuses to build any
    # dependency whose rust-version is above the active toolchain, so this job
    # fails as soon as a dependency requires more than 1.99.
    - name: Check
      run: cargo check --locked --all-targets --verbose

  release:
    name: Release Build
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
    - uses: actions/checkout@v4.1.1

    - name: Install smbclient
      run: sudo apt-get update && sudo apt-get install -y smbclient

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: stable

    - name: Cache dependencies
      uses: Swatinem/rust-cache@v2

    - name: Build release
      run: cargo build --release --verbose

    - name: Upload release binary
      uses: actions/upload-artifact@v4.3.0
      with:
        name: heelonbackup-linux-amd64
        path: target/release/heelonbackup
        if-no-files-found: error
